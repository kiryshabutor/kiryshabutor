<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Highlights: 0 lost events in chaos test, 3100 RPS, 10 of 500 jobs at once, 89% coverage">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1e2d"/><stop offset="1" stop-color="#06121c"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00add8"/><stop offset="1" stop-color="#5dc9e2"/></linearGradient></defs>
<style>
text{font-family:"Segoe UI",Ubuntu,"Helvetica Neue",Arial,sans-serif}
.h{fill:#5b7587;font-family:"Fira Code",Consolas,monospace;font-size:14px}
.n{fill:#00add8;font-size:38px;font-weight:700}
.l{fill:#e6f1f7;font-size:15px;font-weight:600}
.s{fill:#8aa4b5;font-size:12px}
.tile{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<rect width="900" height="250" rx="14" fill="url(#bg)"/>
<rect x="1" y="1" width="898" height="248" rx="13" fill="none" stroke="#00add8" stroke-opacity=".35"/>
<text x="28" y="36" class="h">// numbers, not adjectives</text>
<g class="tile" style="animation-delay:0.15s"><rect x="30" y="56" width="201" height="170" rx="10" fill="#0e2a3d" fill-opacity=".7" stroke="#1d4560"/><rect x="30" y="56" width="201" height="3" rx="1.5" fill="url(#bar)"/><text x="46" y="112" class="n">0</text><text x="46" y="142" class="l">lost events</text><text x="46" y="180" class="s">chaos test · Kafka off 30 s</text><text x="46" y="200" class="s">1000/1000 kept · 0 dupes</text></g>
<g class="tile" style="animation-delay:0.35s"><rect x="243" y="56" width="201" height="170" rx="10" fill="#0e2a3d" fill-opacity=".7" stroke="#1d4560"/><rect x="243" y="56" width="201" height="3" rx="1.5" fill="url(#bar)"/><text x="259" y="112" class="n">3 100</text><text x="259" y="142" class="l">RPS via API Gateway</text><text x="259" y="180" class="s">RideCore load test</text><text x="259" y="200" class="s">p99 &lt; 70 ms · 0% errors</text></g>
<g class="tile" style="animation-delay:0.55s"><rect x="456" y="56" width="201" height="170" rx="10" fill="#0e2a3d" fill-opacity=".7" stroke="#1d4560"/><rect x="456" y="56" width="201" height="3" rx="1.5" fill="url(#bar)"/><text x="472" y="112" class="n">10 / 500</text><text x="472" y="142" class="l">Jobs running at once</text><text x="472" y="180" class="s">JobPool operator</text><text x="472" y="200" class="s">the rest queue up FIFO</text></g>
<g class="tile" style="animation-delay:0.75s"><rect x="669" y="56" width="201" height="170" rx="10" fill="#0e2a3d" fill-opacity=".7" stroke="#1d4560"/><rect x="669" y="56" width="201" height="3" rx="1.5" fill="url(#bar)"/><text x="685" y="112" class="n">89%</text><text x="685" y="142" class="l">test coverage</text><text x="685" y="180" class="s">operator logic</text><text x="685" y="200" class="s">83% across RideCore</text></g>
</svg>