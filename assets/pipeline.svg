<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Event flow: client, API gateway, service, PostgreSQL with outbox, Kafka, idempotent consumer with retry, storage, DLQ">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1e2d"/><stop offset="1" stop-color="#06121c"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d6a85"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0556b"/></marker></defs>
<style>
text{font-family:"Segoe UI",Ubuntu,"Helvetica Neue",Arial,sans-serif}
.h{fill:#5b7587;font-family:"Fira Code",Consolas,monospace;font-size:14px}
.t{fill:#e6f1f7;font-size:14px;font-weight:600}
.tg{fill:#06121c;font-size:14px;font-weight:700}
.s{fill:#8aa4b5;font-size:11px}
.r{fill:#e0556b;font-size:11px}
.ln{stroke:#3d6a85;stroke-width:2;fill:none}
</style>
<rect width="900" height="300" rx="14" fill="url(#bg)"/>
<rect x="1" y="1" width="898" height="298" rx="13" fill="none" stroke="#00add8" stroke-opacity=".35"/>
<text x="28" y="36" class="h">// how an event travels: never lost, never doubled</text>
<circle r="5" fill="#5dc9e2"><animateMotion dur="6s" begin="0.0s" repeatCount="indefinite" path="M72.0 130.0 L828.0 130.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#5dc9e2"><animateMotion dur="6s" begin="1.5s" repeatCount="indefinite" path="M72.0 130.0 L828.0 130.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#5dc9e2"><animateMotion dur="6s" begin="3.0s" repeatCount="indefinite" path="M72.0 130.0 L828.0 130.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="6s" begin="3.0s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#5dc9e2"><animateMotion dur="6s" begin="4.5s" repeatCount="indefinite" path="M72.0 130.0 L828.0 130.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="6s" begin="4.5s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#e0556b"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M702.0 130.0 L702.0 252"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.6;.65;.95;1" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
<rect x="20.0" y="104" width="104" height="52" rx="26" fill="#0e2a3d" stroke="#2a5470"/>
<text x="72.0" y="135.0" text-anchor="middle" class="t">Client</text>
<line x1="127.0" y1="130.0" x2="142.0" y2="130.0" class="ln" marker-end="url(#ar)"/>
<rect x="146.0" y="104" width="104" height="52" rx="10" fill="#00add8" stroke="#00add8"/>
<text x="198.0" y="135.0" text-anchor="middle" class="tg">API Gateway</text>
<text x="198.0" y="176" text-anchor="middle" class="s">REST + JWT</text>
<line x1="253.0" y1="130.0" x2="268.0" y2="130.0" class="ln" marker-end="url(#ar)"/>
<rect x="272.0" y="104" width="104" height="52" rx="10" fill="#00add8" stroke="#00add8"/>
<text x="324.0" y="135.0" text-anchor="middle" class="tg">Service</text>
<text x="324.0" y="176" text-anchor="middle" class="s">gRPC</text>
<line x1="379.0" y1="130.0" x2="394.0" y2="130.0" class="ln" marker-end="url(#ar)"/>
<rect x="398.0" y="104" width="104" height="52" rx="10" fill="#0e2a3d" stroke="#2a5470"/><ellipse cx="450.0" cy="104" rx="51.0" ry="7" fill="#123449" stroke="#2a5470"/>
<text x="450.0" y="135.0" text-anchor="middle" class="t">PostgreSQL</text>
<text x="450.0" y="176" text-anchor="middle" class="s">state + outbox</text>
<line x1="505.0" y1="130.0" x2="520.0" y2="130.0" class="ln" marker-end="url(#ar)"/>
<rect x="524.0" y="104" width="104" height="52" rx="10" fill="#0e2a3d" stroke="#2a5470"/><ellipse cx="576.0" cy="104" rx="51.0" ry="7" fill="#123449" stroke="#2a5470"/>
<text x="576.0" y="135.0" text-anchor="middle" class="t">Kafka</text>
<text x="576.0" y="176" text-anchor="middle" class="s">relay</text>
<line x1="631.0" y1="130.0" x2="646.0" y2="130.0" class="ln" marker-end="url(#ar)"/>
<rect x="650.0" y="104" width="104" height="52" rx="10" fill="#00add8" stroke="#00add8"/>
<text x="702.0" y="135.0" text-anchor="middle" class="tg">Consumer</text>
<text x="702.0" y="176" text-anchor="middle" class="s">idempotent</text>
<line x1="757.0" y1="130.0" x2="772.0" y2="130.0" class="ln" marker-end="url(#ar)"/>
<rect x="776.0" y="104" width="104" height="52" rx="10" fill="#0e2a3d" stroke="#2a5470"/><ellipse cx="828.0" cy="104" rx="51.0" ry="7" fill="#123449" stroke="#2a5470"/>
<text x="828.0" y="135.0" text-anchor="middle" class="t">Storage</text>
<text x="828.0" y="176" text-anchor="middle" class="s">CH · Mongo · Redis</text>
<text x="450.0" y="192" text-anchor="middle" class="s">one transaction</text>
<path d="M680.0 102 C680.0 64,724.0 64,724.0 98" class="ln" style="stroke:#e0556b" marker-end="url(#arr)"/>
<text x="702.0" y="60" text-anchor="middle" class="r">retry + backoff</text>
<path d="M702.0 184 L702.0 228" class="ln" style="stroke:#e0556b" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<rect x="650.0" y="232" width="104" height="40" rx="10" fill="#2a0f17" stroke="#e0556b"/><text x="702.0" y="257" text-anchor="middle" class="t">DLQ</text>
<text x="640.0" y="257" text-anchor="end" class="r">gave up after N tries</text>
</svg>